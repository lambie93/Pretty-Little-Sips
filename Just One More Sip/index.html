<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pretty Little Sips</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Galindo&family=League+Gothic&family=Oswald:wght@200..700&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <header>
        <img
            src="images/prettylittlesipslogo.png"
            alt="Pretty Little Sips logo"
            width="300"
            height="300"
        >

        <div class="about">
            <h2>hi, i'm <span class="highlight">lauren</span>!</h2>

            <p>
                A little collection of all the drinks I've tried, from
                <strong>boba</strong> to <strong>matcha</strong> and
                <strong>coffee</strong><br>
                and everything in between!
            </p>
        </div>
    </header>


    <main>

        <!-- Bubble Tea -->
        <section class="drink-category">
            <h3>Bubble Tea</h3>

            <div class="drink-grid">
                <div class="drink-frame">
                    <img
                        src="images/Coconut_Mango_Boom_-_Heytea_-_NYC-removebg-preview.png"
                        alt="Coconut Mango Boom - Heytea - NYC"
                    >
                </div>
            </div>
        </section>


        <!-- Matcha -->
        <section class="drink-category">
            <h3>Matcha</h3>

            <div class="drink-grid">
                <!-- Add matcha drinks here -->
            </div>
        </section>


        <!-- Coffee -->
        <section class="drink-category">
            <h3>Coffee</h3>

            <div class="drink-grid">
                <!-- Add coffee drinks here -->
            </div>
        </section>


        <!-- Smoothies -->
        <section class="drink-category">
            <h3>Smoothies</h3>

            <div class="drink-grid">
                <div class="drink-frame">
                    <img
                        src="images/Clean_Green_Machine_Smoothie_-_Citizens_of_Soho_-_NYC-removebg-preview.png"
                        alt="Clean Green Machine Smoothie - Citizens of Soho - NYC"
                    >
                </div>
            </div>
        </section>


        <!-- Other -->
        <section class="drink-category">
            <h3>Other</h3>

            <div class="drink-grid">
                <!-- Add other drinks here -->
            </div>
        </section>

    </main>


    <footer>
    <div class="drink-counter">
    <span id="drink-count">0</span> sips & counting!
</div>
    </footer>
<script src="script.js"></script>
</body>

</html>
